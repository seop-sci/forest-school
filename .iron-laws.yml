# 오철칙(iron-laws) 점검 설정 (2026-11-13)
# 쓰는 법: pip install git+https://github.com/JinHo-von-Choi/iron-laws.git 뒤 저장소 맨 위에서 iron-laws check .
# 아래 기본값은 `iron-laws init`이 만든 그대로이고, 맨 끝 "숲속 동물 학교 제외" 묶음만 더했어요.
fail_on: HIGH
excludes:
- .git
- .svn
- .hg
- .serena
- .samcheonpo
- .venv
- venv
- env
- node_modules
- __pycache__
- .pytest_cache
- .mypy_cache
- .ruff_cache
- dist
- build
- target
- bin
- obj
- .next*
- .nuxt*
- .svelte-kit*
- .vercel
- .output
- .expo
- .dart_tool
- .angular
- .turbo
- .cache
- .parcel-cache
- .gradle
- .idea
- .vscode
- out
- coverage
- vendor
- third_party
- storybook-static
- generated
- __generated__
- generated-assets
- '*-build'
- '*-dist'
- '*.min.js'
- '*.min.css'
- '*.bundle.js'
- '*.map'
- package-lock.json
- pnpm-lock.yaml
- yarn.lock
- '*.lock'
# --- 숲속 동물 학교 제외 ---
# dev/: 개발 도구, 그림 만들기 스크립트, 시험 코드예요. 배포되는 판에 들어가지 않아요.
#   (build_gh.py의 SHA-1은 그림 파일 이름 만들기용, fbtest의 vm.runInNewContext는 시험용이라 치명 지적이 잘못 짚은 것이었어요)
- dev
# config.js: Firebase 웹 설정은 원래 공개되는 값이에요. 데이터는 database.rules.json이 지켜요. (CLAUDE.md: 사용자가 말하기 전에는 바꾸지 않아요)
- config.js
# app/README.md: 업로드 키 SHA-1 지문을 Firebase에 등록하는 안내예요. 암호로 쓰는 것이 아니에요.
- app/README.md
include_extensions:
- .py
- .js
- .jsx
- .mjs
- .cjs
- .ts
- .mts
- .cts
- .tsx
- .java
- .cs
- .go
- .rs
- .php
- .c
- .h
- .cpp
- .cc
- .cxx
- .hpp
- .hh
- .kt
- .kts
- .sql
- .sh
- .xml
- .yml
- .yaml
- .json
- .properties
- .toml
- .rules
- .html
- .htm
- .jinja
- .j2
- .cshtml
- .gradle
- .md
- .mdc
limits:
  max_function_lines: 80
  max_file_lines: 600
  max_parameters: 7
  max_nesting: 5
  duplicate_min_nodes: 40
  duplicate_similarity: 0.9
  max_file_bytes: 1000000
  max_cross_file_lookups: 20000
  max_workers: null
  parallel_min_files: null
  max_wall_seconds: null
policies:
  min_versions: {}
  package_index: null
  package_index_max_age_days: 30
  custom_spec: null
  ledger_include_spec_points: false
  private_packages: []
  protected_paths: []
  protected_paths_exclude: []
architecture:
  layers: []
  forbidden: []
  independent: []
  strict: false
respect_gitignore: false
enabled_rules: null
disabled_rules: []
