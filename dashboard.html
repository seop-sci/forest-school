<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2C4A3D">
<title>숲속 동물 학교 지표</title>
<!-- 관리자 지표 페이지. 게임과 같은 Firebase 서버의 forest/stats(관리자만 읽기)와 forest/rank를 읽어서 숫자와 그래프로 보여 줘요.
     서버 규칙이 관리자 계정(forest/adminUids)만 stats를 읽게 막고 있어서, 다른 사람이 열면 아무것도 못 봐요.
     ?demo=1 을 붙이면 서버 없이 가짜 기록으로 화면만 보여 줘요(모양 확인용). 안드로이드와 토스 앱에는 들어가지 않아요 -->
<style>
:root{--bg:#F6F1E6;--card:#FFFDF7;--ink:#2F3B33;--muted:#7A8277;--line:#E4DCCB;--acc:#3F7A55;--acc2:#D9A55B;--warn:#C8553D;--bar:#8DBF8F}
@media (prefers-color-scheme:dark){:root{--bg:#18211C;--card:#202B24;--ink:#E7EDE6;--muted:#9AA79C;--line:#33423A;--acc:#7CC593;--acc2:#E2B66F;--warn:#E07A62;--bar:#5E9A6D}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.45}
header{position:sticky;top:0;z-index:2;background:var(--acc);color:#fff;padding:12px 16px calc(10px);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1 1 auto}
header small{opacity:.85;font-size:12px}
button{font:inherit;border:0;border-radius:10px;padding:8px 12px;background:var(--card);color:var(--ink);cursor:pointer}
header button{background:rgba(255,255,255,.18);color:#fff}
main{max-width:980px;margin:0 auto;padding:14px 12px 40px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:26px;line-height:1.1;margin-top:4px}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.live b{color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
section h2{font-size:15px;margin:0 0 4px}
section p.note{font-size:12px;color:var(--muted);margin:0 0 10px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(80px,38%) 1fr 44px;align-items:center;gap:8px;font-size:13px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--bar);border-radius:6px}
.bar .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:6px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10.5px;color:var(--muted)}
.cols i{display:block;width:100%;background:var(--acc2);border-radius:4px 4px 0 0;min-height:2px}
.cols em{font-style:normal;color:var(--ink);font-size:11px}
@media (max-width:480px){.cols div{font-size:8.5px;letter-spacing:-.3px}.cols div:nth-child(even){color:transparent}}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:4px}
.dot.on{background:var(--acc)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;margin:30px auto;max-width:420px}
.msg button{background:var(--acc);color:#fff;margin-top:12px}
.opts{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 12px}
.opts label{display:flex;align-items:center;gap:4px}
.wide{grid-column:1/-1}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<header>
  <h1>숲속 동물 학교 지표</h1>
  <small id="when">불러오는 중</small>
  <button type="button" id="reload" hidden>새로 고침</button>
</header>
<main id="app"><div class="msg">불러오는 중이에요</div></main>

<script src="config.js"></script>
<script>
(function () {
  'use strict';
  /* 기준 숫자(본부 제안, 지섭이 바꿀 수 있어요) */
  var LIVE_MIN = 5;          // 최근 몇 분 안에 기록이 올라오면 '지금 접속 중'으로 볼지(게임은 1분마다 올려요)
  var AWAY_DAYS = 3;         // 며칠 동안 안 들어오면 '쉬는 중'으로 보고 멈춘 퀘스트를 셀지
  var AUTO_SEC = 60;         // 자동 새로 고침 간격(초)
  var RECENT_N = 30;         // 최근 접속 목록 줄 수

  var KST = 9 * 3600000, DAY = 86400000;
  var TIER = ['유치원', '초등학교', '중학교', '고등학교', '대학교', '대학원'];
  var UNIT = ['년째', '학년', '학년', '학년', '학년', '년째'];
  var ENV = { kakao: '카카오톡', mobile: '휴대폰', pc: '컴퓨터' };
  var $ = function (s) { return document.querySelector(s); };
  var app = $('#app');
  var demo = /[?&]demo=1/.test(location.search);
  var state = { hideDev: true, hideShort: false, auto: true, timer: 0, db: null };   // hideShort: 플레이 5분이 안 되는 학교 빼기(잠깐 열어 본 기록, 시험 기록)

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function num(v) { v = Number(v); return isFinite(v) ? v : 0; }
  function fmt(n) { return Math.round(n).toLocaleString('ko-KR'); }
  function kstDay(t) { return Math.floor((t + KST) / DAY); }
  function dayLabel(d) { var x = new Date(d * DAY); return (x.getUTCMonth() + 1) + '/' + x.getUTCDate(); }
  function ago(t) {
    var s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return '방금';
    if (s < 3600) return Math.floor(s / 60) + '분 전';
    if (s < DAY / 1000) return Math.floor(s / 3600) + '시간 전';
    return Math.floor(s / 86400) + '일 전';
  }
  function playText(s) { s = num(s); return s < 60 ? '1분 미만' : s < 3600 ? Math.floor(s / 60) + '분' : Math.floor(s / 3600) + '시간 ' + Math.floor(s % 3600 / 60) + '분'; }
  function school(r) { var t = Math.max(0, Math.min(5, num(r.tier))); return TIER[t] + ' ' + Math.max(1, num(r.year) || 1) + UNIT[t]; }
  function median(a) { if (!a.length) return 0; a = a.slice().sort(function (x, y) { return x - y; }); var m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; }

  function msg(html, btn) {
    app.innerHTML = '<div class="msg">' + html + (btn ? '<br><button type="button" id="msgBtn">' + btn + '</button>' : '') + '</div>';
  }

  /* 기록 정리: 같은 학교(pid)가 기기를 옮겼으면 가장 최근 기록 하나만 */
  function tidy(raw) {
    var by = {};
    Object.keys(raw || {}).forEach(function (id) {
      var d = raw[id]; if (!d || typeof d !== 'object') return;
      // 엉뚱하게 큰 값 한 줄이 평균과 그래프를 망치지 않게 상한으로 잘라요(서버 규칙도 값 범위를 봐요)
      var cap = function (v, max) { return Math.min(max, Math.max(0, num(v))); }, cut = function (v, n, d) { return typeof v === 'string' ? v.slice(0, n) : d; };
      var r = {
        id: id, seen: cap(d.seen, 253402300799999), born: cap(d.born, 253402300799999), pid: typeof d.pid === 'string' && d.pid ? d.pid.slice(0, 16) : id, name: cut(d.name, 20, ''),
        tier: cap(d.tier, 10), year: cap(d.year, 100), q: d.q == null ? '' : String(d.q).slice(0, 16), qt: cut(d.qt, 60, ''),
        play: cap(d.play, 1e8), sess: cap(d.sess, 1e6), days: cap(d.days, 3650), ads: cap(d.ads, 1e5), score: cap(d.score, 1e9), gearn: cap(d.gearn, 1e7), gspent: cap(d.gspent, 1e7),
        dev: !!d.dev, v: cut(d.v, 32, '?'), env: cut(d.env, 16, '?')
      };
      var o = by[r.pid]; if (!o || r.seen > o.seen) by[r.pid] = r;
    });
    return Object.keys(by).map(function (k) { return by[k]; });
  }

  function barsHTML(rows, max) {
    max = max || Math.max.apply(null, rows.map(function (r) { return r[1]; }).concat([1]));
    return '<div class="bars">' + rows.map(function (r) {
      return '<div class="bar"><span class="lab" title="' + esc(r[0]) + '">' + esc(r[0]) + '</span><span class="tr"><i style="width:' + (r[1] / max * 100).toFixed(1) + '%"></i></span><span class="n">' + fmt(r[1]) + '</span></div>';
    }).join('') + '</div>';
  }
  function countBy(list, key) {
    var m = {}; list.forEach(function (r) { var k = key(r); m[k] = (m[k] || 0) + 1; });
    return Object.keys(m).map(function (k) { return [k, m[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
  }

  function render(stats, rankN) {
    var now = Date.now(), today = kstDay(now);
    var all = tidy(stats), list = state.hideDev ? all.filter(function (r) { return !r.dev; }) : all;
    if (state.hideShort) list = list.filter(function (r) { return r.play >= 300; });
    var live = list.filter(function (r) { return now - r.seen <= LIVE_MIN * 60000; });
    var d1 = list.filter(function (r) { return kstDay(r.seen) === today; });
    var d7 = list.filter(function (r) { return today - kstDay(r.seen) < 7; });
    var newToday = list.filter(function (r) { return r.born && kstDay(r.born) === today; });
    var away = list.filter(function (r) { return now - r.seen > AWAY_DAYS * DAY; });

    // 날짜별 새 학교(14일)
    var cols = [], maxC = 1;
    for (var i = 13; i >= 0; i--) { var d = today - i, n = list.filter(function (r) { return r.born && kstDay(r.born) === d; }).length; cols.push([d, n]); if (n > maxC) maxC = n; }
    // 마지막 접속 나누기
    var gap = [['오늘', 0], ['1~2일 전', 0], ['3~6일 전', 0], ['7~13일 전', 0], ['14일 넘게', 0]];
    list.forEach(function (r) { var g = today - kstDay(r.seen); gap[g <= 0 ? 0 : g <= 2 ? 1 : g <= 6 ? 2 : g <= 13 ? 3 : 4][1] += 1; });
    // 학교급과 학년
    var tiers = countBy(list, school).sort(function (a, b) {
      var ka = TIER.indexOf(a[0].split(' ')[0]) * 10 + parseInt(a[0].split(' ')[1], 10), kb = TIER.indexOf(b[0].split(' ')[0]) * 10 + parseInt(b[0].split(' ')[1], 10); return ka - kb;
    });
    // 쉬는 중인 학교가 멈춘 메인 퀘스트
    var stuck = countBy(away, function (r) { return r.q === '끝' ? '메인 퀘스트 모두 끝' : (r.q ? r.q + ' ' : '') + (r.qt || '?'); }).slice(0, 12);
    var plays = list.map(function (r) { return r.play; }), sess = list.map(function (r) { return r.sess; });
    var adsSum = list.reduce(function (a, r) { return a + r.ads; }, 0), adN = list.filter(function (r) { return r.ads > 0; }).length;
    var adTop = list.filter(function (r) { return r.ads > 0; }).sort(function (a, b) { return b.ads - a.ads; }).slice(0, 10).map(function (r) { return [(r.name || '(이름 없음)') + ' ' + school(r), r.ads]; });
    var vers = countBy(list, function (r) { return r.v; }).slice(0, 8);
    var envs = countBy(list, function (r) { return ENV[r.env] || r.env; });
    var recent = list.slice().sort(function (a, b) { return b.seen - a.seen; }).slice(0, RECENT_N);

    app.innerHTML =
      '<div class="opts"><label><input type="checkbox" id="optDev"' + (state.hideDev ? ' checked' : '') + '> 개발자 메뉴 쓴 학교 빼기</label>' +
      '<label><input type="checkbox" id="optShort"' + (state.hideShort ? ' checked' : '') + '> 플레이 5분 미만 학교 빼기</label>' +
      '<label><input type="checkbox" id="optAuto"' + (state.auto ? ' checked' : '') + '> ' + AUTO_SEC + '초마다 새로 고침</label>' + (demo ? '<b>가짜 기록으로 보는 중(demo)</b>' : '') + '</div>' +
      '<div class="tiles">' +
        '<div class="tile live"><span>지금 접속 중 (' + LIVE_MIN + '분)</span><b>' + fmt(live.length) + '</b></div>' +
        '<div class="tile"><span>오늘 접속</span><b>' + fmt(d1.length) + '</b></div>' +
        '<div class="tile"><span>최근 7일 접속</span><b>' + fmt(d7.length) + '</b></div>' +
        '<div class="tile"><span>오늘 새 학교</span><b>' + fmt(newToday.length) + '</b></div>' +
        '<div class="tile"><span>전체 학교</span><b>' + fmt(list.length) + '</b></div>' +
        '<div class="tile"><span>랭킹 참여</span><b>' + (rankN == null ? '-' : fmt(rankN)) + '</b></div>' +
      '</div>' +
      '<div class="grid">' +
        '<section><h2>날짜별 새 학교 (14일)</h2><p class="note">처음 게임을 시작한 날 기준(한국 시간)</p><div class="cols">' +
          cols.map(function (c) { return '<div><em>' + (c[1] || '') + '</em><i style="height:' + (c[1] / maxC * 100).toFixed(1) + '%"></i>' + dayLabel(c[0]) + '</div>'; }).join('') + '</div></section>' +
        '<section><h2>마지막 접속</h2><p class="note">학교마다 마지막으로 기록이 올라온 날</p>' + barsHTML(gap) + '</section>' +
        '<section><h2>학교급과 학년</h2><p class="note">지금 다니는 학년</p>' + (tiers.length ? barsHTML(tiers) : '<p class="note">기록 없음</p>') + '</section>' +
        '<section><h2>멈춘 메인 퀘스트</h2><p class="note">' + AWAY_DAYS + '일 넘게 안 들어온 학교 ' + fmt(away.length) + '곳이 멈춘 곳(많은 순)</p>' + (stuck.length ? barsHTML(stuck) : '<p class="note">아직 없어요</p>') + '</section>' +
        '<section><h2>플레이</h2><div class="kv">' +
          '<span>플레이 시간 중간값</span><span>' + playText(median(plays)) + '</span>' +
          '<span>플레이 시간 평균</span><span>' + playText(plays.length ? plays.reduce(function (a, b) { return a + b; }, 0) / plays.length : 0) + '</span>' +
          '<span>접속 횟수 중간값</span><span>' + fmt(median(sess)) + '번</span>' +
          '<span>출석 일수 중간값</span><span>' + fmt(median(list.map(function (r) { return r.days; }))) + '일</span>' +
          '<span>광고 본 수 합계</span><span>' + fmt(adsSum) + '편</span>' +
          '<span>광고 본 학교</span><span>' + fmt(adN) + '곳 (' + (list.length ? Math.round(adN / list.length * 100) : 0) + '%)</span>' +
          '<span>광고 본 학교의 평균</span><span>' + (adN ? (adsSum / adN).toFixed(1) : '0') + '편</span>' +
          '<span>오늘 접속한 학교의 광고 합계</span><span>' + fmt(d1.reduce(function (a, r) { return a + r.ads; }, 0)) + '편</span>' +
          '<span>황금 도토리 쓴 양 합계</span><span>' + fmt(list.reduce(function (a, r) { return a + r.gspent; }, 0)) + '개</span>' +
          '<span>황금 도토리 번 양 중간값</span><span>' + fmt(median(list.map(function (r) { return r.gearn; }))) + '개</span>' +
        '</div></section>' +
        '<section><h2>버전과 기기</h2><p class="note">버전</p>' + barsHTML(vers) + '<p class="note" style="margin-top:10px">기기</p>' + barsHTML(envs) + '</section>' +
        '<section><h2>광고를 많이 본 학교</h2><p class="note">지금까지 본 광고 수(많은 순 10곳)</p>' + (adTop.length ? barsHTML(adTop) : '<p class="note">아직 없어요</p>') + '</section>' +
        '<section class="wide"><h2>최근 접속 ' + Math.min(RECENT_N, recent.length) + '곳</h2><div class="scroll"><table><thead><tr><th>교장</th><th>학교</th><th>메인 퀘스트</th><th>플레이</th><th>접속</th><th>출석</th><th>광고</th><th>황금 도토리(번 것, 쓴 것)</th><th>학교 파워</th><th>버전</th><th>기기</th><th>마지막</th></tr></thead><tbody>' +
          recent.map(function (r) {
            var on = now - r.seen <= LIVE_MIN * 60000;
            return '<tr><td><span class="dot' + (on ? ' on' : '') + '"></span>' + esc(r.name || '(이름 없음)') + (r.dev ? ' 🛠' : '') + '</td><td>' + esc(school(r)) + '</td><td class="wrap">' + esc(r.q === '끝' ? '모두 끝' : (r.q + ' ' + r.qt)) + '</td><td>' + playText(r.play) + '</td><td>' + fmt(r.sess) + '번</td><td>' + fmt(r.days) + '일</td><td>' + fmt(r.ads) + '편</td><td>' + fmt(r.gearn) + ', ' + fmt(r.gspent) + '</td><td>' + fmt(r.score) + '</td><td>' + esc(r.v) + '</td><td>' + esc(ENV[r.env] || r.env) + '</td><td>' + ago(r.seen) + '</td></tr>';
          }).join('') + '</tbody></table></div></section>' +
      '</div>' +
      '<p class="note" style="margin-top:14px;color:var(--muted);font-size:12px">토스 판 이용자는 우리 서버를 쓰지 않아서 여기에 없어요(토스 콘솔에서 봐요). 서버에 저장이 켜진 학교만 1분마다 기록을 올려요.</p>';

    $('#optDev').onchange = function (e) { state.hideDev = e.target.checked; render(stats, rankN); };
    $('#optShort').onchange = function (e) { state.hideShort = e.target.checked; render(stats, rankN); };
    $('#optAuto').onchange = function (e) { state.auto = e.target.checked; schedule(); };
    $('#when').textContent = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' 기준';
  }

  function schedule() { clearTimeout(state.timer); if (state.auto && !document.hidden) state.timer = setTimeout(load, AUTO_SEC * 1000); }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && state.auto && state.ready) load(); else clearTimeout(state.timer); });

  function load() {
    if (demo) { render(fake(), 312); schedule(); return; }
    var db = state.db;
    Promise.all([
      db.ref('forest/stats').once('value').then(function (s) { return s.val(); }),
      db.ref('forest/rank').once('value').then(function (s) { var v = s.val(); return v ? Object.keys(v).length : 0; }).catch(function () { return null; })
    ]).then(function (r) { render(r[0], r[1]); schedule(); })
      .catch(function (e) {
        if (/permission/i.test(String(e && (e.code || e.message)))) msg('관리자 계정만 볼 수 있어요.<br><small>' + esc(state.uid ? '이 계정 번호: ' + state.uid.slice(0, 8) : '') + '</small>', '다른 계정으로 로그인');
        else msg('기록을 불러오지 못했어요. 인터넷을 확인해 주세요.', '다시 시도');
        $('#msgBtn').onclick = function () { if (/permission/i.test(String(e && (e.code || e.message)))) firebase.auth().signOut().then(start); else load(); };
      });
  }

  function start() {
    var auth = firebase.auth();
    var u = auth.currentUser;
    if (!u || u.isAnonymous) {
      msg('관리자 구글 계정으로 로그인해 주세요.', '구글로 로그인');
      $('#msgBtn').onclick = function () {
        auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function (e) {
          if (e && /popup/i.test(e.code || '')) return auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
          msg('로그인하지 못했어요. 다시 해 주세요.', '구글로 로그인'); $('#msgBtn').onclick = start;
        });
      };
      return;
    }
    state.uid = u.uid; state.ready = true;
    $('#reload').hidden = false;
    msg('불러오는 중이에요');
    load();
  }

  /* 가짜 기록(?demo=1): 화면 모양 확인용 */
  function fake() {
    var out = {}, now = Date.now(), qs = [['1-3', '놀이터 짓기'], ['5-2', '과학실 짓기'], ['7-4', '첫 반장 뽑기'], ['12-6', '동아리 나누기'], ['15-3', '기숙사 짓기'], ['끝', '']];
    for (var i = 0; i < 180; i++) {
      var t = Math.min(3, Math.floor(Math.random() * Math.random() * 5)), q = qs[Math.floor(Math.random() * qs.length)];
      var seen = now - Math.floor(Math.pow(Math.random(), 2.5) * 20 * DAY), born = seen - Math.floor(Math.random() * 12 * DAY);
      out['u' + i] = { seen: seen, born: born, pid: 'p' + i, name: ['졸린 다람쥐', '용감한 토끼', '수줍은 판다', '배고픈 곰'][i % 4] + ' ' + i, tier: t, year: 1 + Math.floor(Math.random() * 3), q: q[0], qt: q[1],
        play: Math.floor(Math.random() * 40000), sess: Math.floor(Math.random() * 60), days: Math.floor(Math.random() * 14), ads: Math.floor(Math.random() * 30), gearn: Math.floor(Math.random() * 200), dev: i % 37 === 0, v: ['3.0.0', '3.1.0', '2.3.5'][i % 3], env: ['mobile', 'pc', 'kakao'][i % 5 === 0 ? 1 : i % 7 === 0 ? 2 : 0] };
    }
    return out;
  }

  $('#reload').onclick = function () { load(); };
  if (demo) { state.ready = true; $('#reload').hidden = false; load(); return; }
  if (!window.FOREST_FIREBASE) { msg('서버 설정(config.js)이 없어요.'); return; }
  var base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  function sc(f) { return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = base + f; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
  sc('firebase-app-compat.js').then(function () { return Promise.all([sc('firebase-auth-compat.js'), sc('firebase-database-compat.js')]); }).then(function () {
    firebase.initializeApp(window.FOREST_FIREBASE);
    state.db = firebase.database();
    firebase.auth().getRedirectResult().catch(function () {}).then(function () {
      firebase.auth().onAuthStateChanged(function () { start(); });
    });
  }).catch(function () { msg('서버 도구를 불러오지 못했어요. 인터넷을 확인해 주세요.'); });
})();
</script>
