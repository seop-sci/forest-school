name: Security rules regression
on:
  pull_request:
    branches: [main, feat/v300]
    paths: ['database.rules.json', 'dev/gh_database.rules.json', 'dev/fbtest/emulator/**', '.github/workflows/security-rules.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - run: |
          set +e
          (npm ci && npm test) > security.log 2>&1
          result=$?
          cat security.log
          if [ "$result" -ne 0 ]; then
            python3 -c 'import pathlib; s=pathlib.Path("security.log").read_text()[-2500:]; print("::error::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          else
            python3 -c 'import pathlib; s="\n".join(x for x in pathlib.Path("security.log").read_text().splitlines() if "PASS" in x); print("::notice::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          fi
          exit "$result"
        working-directory: dev/fbtest/emulator
