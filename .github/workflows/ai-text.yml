# AI 글 도우미 (2026-11-23 woodani: Console 크레딧으로 1번 손님 대사, 3번 게임 글 훑어보기)
# 손으로만 돌려요(Actions > AI 글 도우미 > Run workflow). 게임 파일은 바꾸지 않고, 결과(dev/ai_out/)만 새 가지 ai/<job>-<번호>에 올려요.
# 키는 저장소 Secrets의 ANTHROPIC_API_KEY. 결과 가지는 본부가 읽고 지워요(main에 합치지 않아요).
name: AI 글 도우미
on:
  workflow_dispatch:
    inputs:
      job:
        description: '무엇을 할까요 (lines 손님 대사, proof 글 훑어보기, audit 코드 점검, content 글 재료, en 영어 밑글)'
        required: true
        default: lines
        type: choice
        options: [lines, proof, audit, content, en, verify, newbie, bio]
      model:
        description: '모델 (auto면 작업마다 정한 모델)'
        required: true
        default: auto
        type: string
      extra:
        description: '더 줄 것 (예: --areas=1,2)'
        required: false
        default: ''
        type: string
permissions:
  contents: write
concurrency:
  group: ai-text-${{ inputs.job }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: 돌리기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JOB: ${{ inputs.job }}
          MODEL: ${{ inputs.model }}
          EXTRA: ${{ inputs.extra }}
        run: |
          cd dev
          case "$JOB" in proof) S=ai_proof.py;; audit) S=ai_audit.py;; content) S=ai_content.py;; en) S=ai_en.py;; verify) S=ai_verify.py;; newbie) S=ai_newbie.py;; bio) S=ai_bio.py;; *) S=ai_lines.py;; esac
          if [ "$MODEL" = "auto" ]; then python3 "$S" $EXTRA; else python3 "$S" "--model=$MODEL" $EXTRA; fi
      - name: 결과를 새 가지에 올리기
        if: always()   # 중간에 멈춰도 그때까지 받은 것은 올려요
        env:
          JOB: ${{ inputs.job }}
          RUN_NO: ${{ github.run_number }}
        run: |
          [ -d dev/ai_out ] || exit 0
          git config user.name "forest-ai-bot"
          git config user.email "forest-ai-bot@users.noreply.github.com"
          git checkout -b "ai/$JOB-$RUN_NO"
          git add -f dev/ai_out
          git commit -m "AI 글 도우미 $JOB 결과 ($RUN_NO)"
          git push origin "ai/$JOB-$RUN_NO"
          echo "결과 가지: ai/$JOB-$RUN_NO" >> "$GITHUB_STEP_SUMMARY"
          tail -3 dev/ai_out/*.md >> "$GITHUB_STEP_SUMMARY"
