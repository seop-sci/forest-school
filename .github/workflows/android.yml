# 안드로이드 판 만들기: index.html이나 app 폴더가 바뀌면 깃허브가 대신 빌드해요.
# 저장소 비밀값 ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD가 있으면 구글 플레이에 올릴 .aab와 설치용 .apk를,
# 없으면 휴대폰에서 시험해 볼 디버그 .apk만 만들어요. 결과는 Actions 화면의 Artifacts에서 내려받아요.
name: Android build

on:
  push:
    branches: [main]
    paths: ['index.html', 'app/**', '.github/workflows/android.yml']
  workflow_dispatch:

# 2.0.0 보안 점검(3-4): 저장소는 읽기만 해요. 액션은 태그가 아니라 커밋 값으로 고정해요(주석이 그 커밋의 태그)
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04   # 안드로이드 SDK가 깔려 있는 이미지
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3   # v4
        with:
          distribution: temurin
          java-version: 21
      - name: 업로드 키 꺼내기
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "ADMOB_TEST=0" >> "$GITHUB_ENV"
          else
            echo "ADMOB_TEST=1" >> "$GITHUB_ENV"
            echo "::warning::비밀값이 없어서 시험용 디버그 APK만 만들어요"
          fi
      - name: 웹 게임을 앱 안에 넣기
        working-directory: app
        run: |
          npm ci
          node build-www.mjs
          npx cap sync android
      - name: 빌드
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then T="bundleRelease assembleRelease"; else T="assembleDebug"; fi
          set -o pipefail
          ./gradlew --no-daemon --stacktrace $T 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: 실패하면 까닭 보여 주기
        if: failure()
        run: |
          grep -n -A14 "What went wrong" "$RUNNER_TEMP/build.log" | head -40 | while IFS= read -r l; do echo "::error::$l"; done || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          retention-days: 7   # 2.0.0 보안 점검(3-1): 서명한 앱 파일은 7일만 남겨요(공개 저장소라 누구나 받을 수 있어요)
          name: forest-school-android-${{ github.run_number }}
          path: |
            app/android/app/build/outputs/bundle/release/*.aab
            app/android/app/build/outputs/apk/release/*.apk
            app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 2026-10-28 지섭 요청: 빌드가 끝나면 예전 안드로이드 결과물을 지워요. 이번 것과 바로 앞 것 두 개만 남겨요(혹시 몰라 직전 판은 둬요)
  cleanup:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: write   # 결과물 지우기에만 써요
    steps:
      - name: 예전 안드로이드 결과물 지우기 (최근 두 개만 남김)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("forest-school-android-")) | [.created_at, .id, .name] | @tsv' \
            | sort -r | tail -n +3 | while IFS=$'\t' read -r at id name; do
              echo "지워요: $name ($at)"
              gh api -X DELETE "repos/$REPO/actions/artifacts/$id" || echo "::warning::$name 지우기 실패"
            done
