# 안드로이드 판 만들기: index.html이나 app 폴더가 바뀌면 깃허브가 대신 빌드해요.
# 저장소 비밀값 ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD가 있으면 구글 플레이에 올릴 .aab와 설치용 .apk를,
# 없으면 휴대폰에서 시험해 볼 디버그 .apk만 만들어요. 결과는 Actions 화면의 Artifacts에서 내려받아요.
name: Android build

on:
  push:
    branches: [main]
    paths: ['index.html', 'app/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04   # 안드로이드 SDK가 깔려 있는 이미지
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 웹 게임을 앱 안에 넣기
        working-directory: app
        run: |
          npm ci
          node build-www.mjs
          npx cap sync android
      - name: 업로드 키 꺼내기
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::비밀값이 없어서 시험용 디버그 APK만 만들어요"
          fi
      - name: 빌드
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then T="bundleRelease assembleRelease"; else T="assembleDebug"; fi
          set -o pipefail
          ./gradlew --no-daemon $T 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: 실패하면 까닭 보여 주기
        if: failure()
        run: |
          grep -E "error|Error|FAILURE|What went wrong|SDK|>" "$RUNNER_TEMP/build.log" | tail -25 | while IFS= read -r l; do echo "::error::$l"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: forest-school-android-${{ github.run_number }}
          path: |
            app/android/app/build/outputs/bundle/release/*.aab
            app/android/app/build/outputs/apk/release/*.apk
            app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
