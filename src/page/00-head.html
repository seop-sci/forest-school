<title>숲속 동물 학교</title>
<script>
/* 태블릿 맞춤: 화면이 휴대폰보다 확연히 크면 화면 너비를 좁게 잡아 게임 전체를 크게 보여 준다.
   게임 칸(480)과 세로(800)가 둘 다 들어가는 만큼만 키우고, 휴대폰과 가로 화면은 그대로 둔다 */
(function(){
  var DW = 500, DH = 800, last = '';
  function fit(){
    var m = document.querySelector('meta[name=viewport]');
    if (!m) return;
    var a = screen.width || 0, b = screen.height || 0;
    var land = window.matchMedia && matchMedia('(orientation: landscape)').matches;
    var W = land ? Math.max(a, b) : Math.min(a, b), H = land ? Math.min(a, b) : Math.max(a, b);
    var s = Math.min(W / DW, H / DH);
    // 제보(안드로이드 화면이 작게 보임): 너비가 PW_MAX보다 넓은 휴대폰(예: 화면 크기를 작게 한 기기, 약 512칸)은 게임 칸(최대 480)이 가운데에 작게 놓여요.
    // 세로 휴대폰은 PW칸 너비로 그려서 화면에 꽉 차게 키워요
    var PW = 412, PW_MAX = 440;
    var c = (W && s > 1.15) ? 'width=' + Math.round(W / s) : (!land && W > PW_MAX) ? 'width=' + PW : 'width=device-width, initial-scale=1';
    if (c !== last) { last = c; m.setAttribute('content', c); }
  }
  fit();
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 150); });
  if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', fit);
})();
</script>
